[project]
name = "skaetch"
version = "0.1.0"
description = "Interactive SKA radio interferometry outreach simulator"
authors = [
    { name = "Peter Sims", email = "6097708+PSims@users.noreply.github.com" }
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["SKA", "radio astronomy", "interferometry", "outreach"]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "matplotlib",
    "pillow",
]

[project.urls]
Repository = "https://github.com/PSims/SKAetch"
Issues = "https://github.com/PSims/SKAetch/issues"

[project.scripts]
skaetch = "skaetch:main"

[dependency-groups]
geometry = [
    "ska-ost-array-config==4.5.0",
]

[tool.uv.sources]
ska-ost-array-config = { index = "skao" }

[[tool.uv.index]]
name = "skao"
url = "https://artefact.skao.int/repository/pypi-internal/simple"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
